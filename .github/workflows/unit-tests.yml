name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout Codex skill validator
        uses: actions/checkout@v6
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .tmp/validators/openai-skills

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Monica.slnx
            tests/Directory.Build.props
            tests/Directory.Packages.props
            **/*.csproj

      - name: Validate template package version
        run: python3 eng/sync-template-version.py --check

      - name: Validate package maturity catalog
        run: python3 eng/validate-package-tiers.py

      - name: Install Agent Skill validation dependencies
        run: python3 -m pip install -r scripts/requirements-agent-skills.txt

      - name: Validate Monica Agent Skill contracts
        run: |
          python3 scripts/validate_agent_skills.py
          python3 scripts/sync_agent_skills.py --check
          python3 -m unittest discover -s scripts/tests -p "test*.py"

      - name: Validate portable Agent Skills
        shell: bash
        run: |
          command -v skills-ref >/dev/null
          for skill in skills/*; do
            skills-ref validate "${skill}"
          done

      - name: Validate Agent Skills for Codex
        shell: bash
        run: |
          VALIDATOR=".tmp/validators/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py"
          test -f "${VALIDATOR}"
          for skill in skills/*; do
            python3 "${VALIDATOR}" "${skill}"
          done

      - name: Run skill-owned tests
        run: python3 scripts/test_agent_skills.py

      - name: Restore solution
        run: dotnet restore Monica.slnx

      - name: Build solution
        run: dotnet build Monica.slnx --no-restore --configuration Release -m

      - name: Run unit tests
        run: dotnet test Monica.slnx --no-restore --no-build --configuration Release --verbosity minimal --logger "trx;LogFilePrefix=unit-tests" --collect:"XPlat Code Coverage" --results-directory tests/TestResults -m:1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: tests/TestResults
          if-no-files-found: warn

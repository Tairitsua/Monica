name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, for example 1.0.0-rc.1"
        required: true
        type: string
      publish_nuget:
        description: "Publish packages to NuGet"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monica-release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  guide-bundle:
    name: Build and smoke the unified guide bundle (${{ matrix.rid }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
            tfm: net10.0-windows
            entry: Monica.Guide.exe
            environment: windows
          - rid: linux-x64
            runs-on: ubuntu-latest
            tfm: net10.0
            entry: Monica.Guide
            environment: linux
          - rid: osx-arm64
            runs-on: macos-latest
            tfm: net10.0
            entry: Monica.Guide
            environment: macos

    env:
      CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Version is required." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish the unified Monica Guide executable
        shell: bash
        run: |
          dotnet publish Monica.Guide.App/Monica.Guide.App.csproj \
            --configuration "${CONFIGURATION}" \
            --framework ${{ matrix.tfm }} \
            --runtime ${{ matrix.rid }} \
            --self-contained false \
            --output artifacts/guide-publish \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:SatelliteResourceLanguages=zh-Hans \
            -p:DebugType=None \
            -p:GenerateDocumentationFile=false

      - name: Build the unified guide release bundle
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python scripts/build_monica_guide_bundle.py build \
            --tag "${{ steps.version.outputs.tag_name }}" \
            --rid ${{ matrix.rid }} \
            --publish-dir artifacts/guide-publish \
            --output-dir artifacts/guide-bundle \
            --dotnet-sdk "$(dotnet --version)"
          mkdir -p artifacts/guide-release
          cp "artifacts/guide-bundle/monica-guide-${{ steps.version.outputs.tag_name }}-${{ matrix.rid }}.zip" \
            artifacts/guide-release/

      - name: Smoke test the guide executable against the released bundle
        shell: bash
        run: |
          export MONICA_GUIDE_DATA_ROOT="$(pwd)/.tmp-guide-state"
          mkdir -p artifacts/guide-extracted
          python - <<'PY'
          import zipfile
          import glob
          archive = glob.glob("artifacts/guide-bundle/monica-guide-*-*.zip")[0]
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall("artifacts/guide-extracted")
          PY
          ENTRY="artifacts/guide-extracted/app/${{ matrix.entry }}"
          if [[ "${{ matrix.rid }}" != "win-x64" ]]; then
            chmod +x "${ENTRY}"
          fi
          digest() { python -c "import json,sys;print(json.load(open(sys.argv[1]))['plan']['planDigest'])" "$1"; }
          ENVIRONMENT="${{ matrix.environment }}"

          "${ENTRY}" configure --product monica --environment "${ENVIRONMENT}" --target shared --json > smoke-configure-preview.json
          PLAN_DIGEST="$(digest smoke-configure-preview.json)"
          "${ENTRY}" configure --product monica --environment "${ENVIRONMENT}" --target shared \
            --apply --plan-digest "${PLAN_DIGEST}" --json > smoke-configure-apply.json
          test -f "${HOME}/.agents/skills/monica-guide/SKILL.md"
          "${ENTRY}" status --product monica --json > smoke-status.json
          python - <<'PY'
          import json
          status = json.load(open("smoke-status.json", encoding="utf-8-sig"))
          assert status["status"] == "ready", status["status"]
          check_prefix = "skills.${{ matrix.environment }}.shared.catalog"
          installed = any(check["id"].startswith(check_prefix)
                          and check["status"] == "ok"
                          for check in status["checks"])
          assert installed, "installed skill projection was not verified"
          PY

          "${ENTRY}" unconfigure --product monica --environment "${ENVIRONMENT}" --target shared --json > smoke-unconfigure-preview.json
          PLAN_DIGEST="$(digest smoke-unconfigure-preview.json)"
          "${ENTRY}" unconfigure --product monica --environment "${ENVIRONMENT}" --target shared \
            --apply --plan-digest "${PLAN_DIGEST}" --json > smoke-unconfigure-apply.json
          test ! -e "${HOME}/.agents/skills/monica-guide"

      - name: Upload the unified guide bundle
        uses: actions/upload-artifact@v7
        with:
          name: monica-guide-bundle-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/guide-release/*
          if-no-files-found: error

  release:
    name: Build, pack, and release
    needs: guide-bundle
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Codex skill validator
        uses: actions/checkout@v6
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .tmp/validators/openai-skills

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Monica.slnx
            tests/Directory.Build.props
            tests/Directory.Packages.props
            **/*.csproj

      - name: Resolve version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CURRENT_REF="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            VERSION="${{ inputs.version }}"
            CURRENT_REF="${GITHUB_SHA}"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Version is required." >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "${VERSION_WITHOUT_BUILD}" == *"-"* ]]; then
            PRERELEASE=true
            SKILL_CHANNEL=preview
          else
            PRERELEASE=false
            SKILL_CHANNEL=stable
          fi

          PUBLISHED_AT="$(git show -s --format=%cI "${CURRENT_REF}")"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "target_commitish=${CURRENT_REF}" >> "${GITHUB_OUTPUT}"
          echo "skill_channel=${SKILL_CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "published_at=${PUBLISHED_AT}" >> "${GITHUB_OUTPUT}"

          PREVIOUS_TAG=""
          while IFS= read -r CANDIDATE_TAG; do
            RELEASE_STATUS="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}")"
            case "${RELEASE_STATUS}" in
              200)
                PREVIOUS_TAG="${CANDIDATE_TAG}"
                break
                ;;
              404)
                echo "Skipping unpublished tag ${CANDIDATE_TAG} while resolving release history."
                ;;
              *)
                echo "GitHub release lookup for ${CANDIDATE_TAG} returned HTTP ${RELEASE_STATUS}." >&2
                exit 1
                ;;
            esac
          done < <(git tag \
            --merged "${CURRENT_REF}^" \
            --sort=-version:refname \
            --format='%(refname:strip=2)' \
            --list 'v*')

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            RELEASE_NOTES_RANGE="${PREVIOUS_TAG}..${CURRENT_REF}"
          else
            RELEASE_NOTES_RANGE="${CURRENT_REF}"
          fi

          echo "release_notes_args=${RELEASE_NOTES_RANGE} --tag v${VERSION} --strip header" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Validate source and template package version
        run: python3 eng/sync-template-version.py --check --version "${{ steps.version.outputs.version }}"

      - name: Validate package maturity catalog
        run: python3 eng/validate-package-tiers.py

      - name: Require the immutable release tag
        shell: bash
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          TARGET_COMMIT="${{ steps.version.outputs.target_commitish }}"
          git check-ref-format "refs/tags/${TAG_NAME}" >/dev/null || {
            echo "The release tag name is invalid." >&2
            exit 1
          }
          REMOTE_TAG_COMMIT="$(
            git ls-remote origin "refs/tags/${TAG_NAME}" "refs/tags/${TAG_NAME}^{}" |
              awk -v direct="refs/tags/${TAG_NAME}" -v peeled="refs/tags/${TAG_NAME}^{}" '
                $2 == direct { direct_sha = $1 }
                $2 == peeled { peeled_sha = $1 }
                END {
                  if (peeled_sha != "") print peeled_sha
                  else if (direct_sha != "") print direct_sha
                  else exit 1
                }
              '
          )" || {
            echo "Push the immutable tag before running release packaging and smoke tests." >&2
            exit 1
          }
          LOCAL_TAG_COMMIT="$(git rev-parse "${TAG_NAME}^{commit}")"
          if [[ "${LOCAL_TAG_COMMIT}" != "${TARGET_COMMIT}" ]]; then
            echo "The release tag does not resolve to the selected commit." >&2
            exit 1
          fi
          if [[ "${REMOTE_TAG_COMMIT}" != "${TARGET_COMMIT}" ]]; then
            echo "The remote release tag does not resolve to the selected commit." >&2
            exit 1
          fi

      - name: Install Agent Skill validation dependencies
        run: python3 -m pip install -r scripts/requirements-agent-skills.txt

      - name: Validate Monica Agent Skill contracts
        run: |
          python3 scripts/validate_agent_skills.py
          python3 scripts/sync_agent_skills.py --check
          python3 -m unittest discover -s scripts/tests -p "test*.py"

      - name: Validate portable Agent Skills
        shell: bash
        run: |
          command -v skills-ref >/dev/null
          for skill in skills/*; do
            skills-ref validate "${skill}"
          done

      - name: Validate Agent Skills for Codex
        shell: bash
        run: |
          VALIDATOR=".tmp/validators/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py"
          test -f "${VALIDATOR}"
          for skill in skills/*; do
            python3 "${VALIDATOR}" "${skill}"
          done

      - name: Run skill-owned tests
        run: python3 scripts/test_agent_skills.py

      - name: Resolve verified Agent Skill index history
        id: previous_skill_index
        shell: bash
        run: |
          PREVIOUS_TAG="${{ steps.version.outputs.previous_tag }}"
          if [[ -z "${PREVIOUS_TAG}" ]] || ! git cat-file -e "${PREVIOUS_TAG}:.monica/agent-skill-catalog.json" 2>/dev/null; then
            echo "No prior Agent Skill release contract exists; this is the first catalog release."
            echo "path=" >> "${GITHUB_OUTPUT}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p artifacts/release-inputs
          PREVIOUS_INDEX="artifacts/release-inputs/${PREVIOUS_TAG}-agent-skill-index.json"
          curl --fail --location --silent --show-error \
            "https://github.com/Tairitsua/Monica/releases/download/${PREVIOUS_TAG}/agent-skill-index.json" \
            --output "${PREVIOUS_INDEX}"
          echo "path=${PREVIOUS_INDEX}" >> "${GITHUB_OUTPUT}"
          echo "tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: ${{ steps.version.outputs.release_notes_args }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Restore solution
        run: dotnet restore Monica.slnx

      - name: Build solution
        run: dotnet build Monica.slnx --configuration "${CONFIGURATION}" --no-restore -m -p:Version=${{ steps.version.outputs.version }}

      - name: Test solution
        run: dotnet test Monica.slnx --configuration "${CONFIGURATION}" --no-build --verbosity minimal --logger "trx;LogFilePrefix=release-tests" --results-directory tests/TestResults -m:1

      - name: Pack packages
        shell: bash
        run: |
          PACKAGE_PROJECTS="$(python3 eng/validate-package-tiers.py --list-public-projects)"
          mkdir -p artifacts/packages
          while IFS= read -r project; do
            dotnet pack "${project}" \
              --configuration "${CONFIGURATION}" \
              --no-build \
              --output artifacts/packages \
              -p:Version=${{ steps.version.outputs.version }} \
              < /dev/null
          done <<< "${PACKAGE_PROJECTS}"

      - name: Build immutable Agent Skill release artifacts
        shell: bash
        run: |
          HISTORY_ARGS=()
          if [[ -n "${{ steps.previous_skill_index.outputs.path }}" ]]; then
            HISTORY_ARGS+=(
              --previous-index "${{ steps.previous_skill_index.outputs.path }}"
              --previous-tag "${{ steps.previous_skill_index.outputs.tag }}"
            )
          fi
          python3 scripts/build_agent_skill_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag_name }}" \
            --commit "${{ steps.version.outputs.target_commitish }}" \
            --channel "${{ steps.version.outputs.skill_channel }}" \
            --published-at "${{ steps.version.outputs.published_at }}" \
            --output artifacts/agent-skills \
            "${HISTORY_ARGS[@]}"

      - name: Download the unified guide bundles
        uses: actions/download-artifact@v8
        with:
          pattern: monica-guide-bundle-${{ steps.version.outputs.version }}-*
          path: artifacts/guide-release
          merge-multiple: true

      - name: Compose the release digest manifest
        shell: bash
        run: |
          SKILLS_ZIP="artifacts/agent-skills/monica-agent-skills-${{ steps.version.outputs.tag_name }}.zip"
          : > artifacts/guide-release/SHA256SUMS
          for asset in artifacts/guide-release/*.zip "${SKILLS_ZIP}"; do
            echo "$(sha256sum "${asset}" | cut -d' ' -f1)  $(basename "${asset}")" >> artifacts/guide-release/SHA256SUMS
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: monica-packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Upload Agent Skill artifacts
        uses: actions/upload-artifact@v7
        with:
          name: monica-agent-skills-${{ steps.version.outputs.version }}
          path: artifacts/agent-skills/*
          if-no-files-found: error

      - name: Revalidate immutable release tag before publication
        shell: bash
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          TARGET_COMMIT="${{ steps.version.outputs.target_commitish }}"
          REMOTE_TAG_COMMIT="$(
            git ls-remote origin "refs/tags/${TAG_NAME}" "refs/tags/${TAG_NAME}^{}" |
              awk -v direct="refs/tags/${TAG_NAME}" -v peeled="refs/tags/${TAG_NAME}^{}" '
                $2 == direct { direct_sha = $1 }
                $2 == peeled { peeled_sha = $1 }
                END {
                  if (peeled_sha != "") print peeled_sha
                  else if (direct_sha != "") print direct_sha
                  else exit 1
                }
              '
          )" || {
            echo "The remote release tag disappeared before publication." >&2
            exit 1
          }
          if [[ "${REMOTE_TAG_COMMIT}" != "${TARGET_COMMIT}" ]]; then
            echo "The remote release tag moved before publication; refusing to publish." >&2
            exit 1
          fi

      - name: Publish to NuGet
        if: ${{ env.NUGET_API_KEY != '' && (github.event_name == 'push' || inputs.publish_nuget) }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Monica ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ steps.version.outputs.target_commitish }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/agent-skills/agent-skill-catalog.json
            artifacts/agent-skills/agent-skill-index.json
            artifacts/agent-skills/agent-skill-manifest.json
            artifacts/agent-skills/monica-agent-skills-${{ steps.version.outputs.tag_name }}.zip
            artifacts/guide-release/monica-guide-${{ steps.version.outputs.tag_name }}-*.zip
            artifacts/guide-release/SHA256SUMS

      - name: Record source-index roll-forward gate
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Agent Skill index roll-forward required

          The published release index is an immutable release asset. Before creating the next Monica tag,
          download `agent-skill-index.json`, run `scripts/roll_forward_agent_skill_index.py --write`,
          run `scripts/sync_agent_skills.py --write`, validate, and commit the source/index snapshot update.
          The next release fails closed if the previous verified release asset is unavailable or rewrites history.
          EOF
